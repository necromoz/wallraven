name: Desktop build

# Builds the Windows installer on a Windows runner GitHub provides, so
# releasing no longer depends on anyone's machine or on Lovable.
#
# Pushing to main or a fixes/* branch builds and keeps the installer as a
# downloadable artifact for 14 days. Pushing a tag like v0.8.14 additionally
# publishes it as a GitHub Release.
#
# Cost note: the free plan includes 2,000 Actions minutes a month on private
# repos and Windows bills at a higher rate, but this build is a few minutes,
# so normal use sits well inside the allowance.

on:
  push:
    branches: [main, "fixes/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      keep_installer:
        description: "Keep the installer as a downloadable artifact"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Check for NSIS
        shell: bash
        run: |
          if command -v makensis >/dev/null 2>&1; then
            echo "makensis found on PATH"
          elif [ -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            echo "makensis found in Program Files (x86)"
          elif [ -x "/c/Program Files/NSIS/makensis.exe" ]; then
            echo "makensis found in Program Files"
          else
            echo "makensis not present, installing"
            choco install nsis --no-progress -y
          fi

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < electron/VERSION)" >> "$GITHUB_OUTPUT"

      # Retry the build rather than failing the release on someone else's bad
      # minute. The packager downloads Electron from GitHub's release servers,
      # and that has already returned a 500 once mid-build. Nothing about the
      # code was wrong; the artifact simply was not there that second.
      # The Store package is built from the same packaged app as the installer,
      # in the same job, so the two can never be built from different commits.
      #
      # The identity values come from Partner Center. Until the name is
      # reserved these repository variables are unset and the build falls back
      # to placeholders: the package is then installable locally for testing
      # but cannot be submitted, which is the safe way round.
      - name: Build installer and Store package
        shell: bash
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::Build attempt $attempt"
            if node scripts/build-desktop.mjs --platform win32 --arch x64 --msix; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 20))
          done
          echo "::error::the installer build failed three times; this is unlikely to be transient"
          exit 1

      # A skipped MSIX step would otherwise look like a successful build. The
      # runner image is expected to carry the Windows SDK; if it stops doing
      # so, this is where that is discovered.
      - name: Check the Store package was produced
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          # A prerelease has no Store package by design: the Store reserves the
          # fourth version field, so a -beta suffix has nowhere to go.
          case "$version" in
            *-*)
              echo "$version is a prerelease, so no Store package is expected"
              exit 0
              ;;
          esac
          shopt -s nullglob
          pkgs=(dist/*.msix)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "::error::no .msix was produced -- makeappx was probably not found on the runner"
            exit 1
          fi
          ls -la "${pkgs[@]}"

      - name: Checksum
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          sha256sum *.exe *.msix | tee SHA256SUMS.txt

      # Artifacts, and why there are none by default.
      #
      # The installer is 112 MB and the Store package another 110 MB. Uploading
      # both on every push, kept for a fortnight, filled the 0.5 GB of Actions
      # storage the plan includes in about two pushes. Nobody ever downloaded
      # one: a tagged build publishes the installer to the release, which does
      # not count against this quota, and anything else is tested by running
      # from source.
      #
      # An earlier version of this kept just the checksum file, on the grounds
      # that it is bytes rather than megabytes. That was wrong. Storage is
      # metered in GB-hours over the month and deleting artifacts does not give
      # back what has already accrued, so once the allowance is spent every
      # upload is refused regardless of size, and with a zero budget a refused
      # upload fails the job. That included tag builds, before they reached the
      # release steps. The checksums are printed in the log by the step above,
      # and published with every release, so nothing is lost.
      #
      # The installer is uploaded only when someone asks for it by running the
      # workflow by hand with "Keep the installer" ticked, and even then a full
      # allowance only loses the artifact, never the build.
      - name: Keep the installer (only when asked)
        if: inputs.keep_installer
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Wallraven-Setup-v${{ steps.version.outputs.version }}
          path: dist/*.exe
          retention-days: 2
          if-no-files-found: error

      # Only on a version tag. The checksum file is published alongside the
      # installer so the updater can verify what it downloaded rather than
      # trusting whatever the manifest points at.
      #
      # This one goes to the private repo: a record alongside the source, not
      # something users reach.
      - name: Publish release (private, for the record)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true

      # And this one is the copy users actually download.
      #
      # This repository is private, so a release published here returns 404 to
      # anyone without a token -- including the app's own updater. That went
      # unnoticed through two releases because every test was made with a token
      # in hand. The public copy is the one the update manifest points at, and
      # publishing both from the same job is what stops them drifting apart
      # again.
      - name: Publish release (public downloads)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: wallraven-app/wallraven
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: WallRaven ${{ steps.version.outputs.version }}
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          body: |
            Windows installer for WallRaven ${{ steps.version.outputs.version }}.

            **Verify before running:**

            ```
            certutil -hashfile Wallraven-Setup-v${{ steps.version.outputs.version }}.exe SHA256
            ```

            It should match the value in `SHA256SUMS.txt`.

            The installer is not code-signed yet, so Windows SmartScreen will
            warn you. Choose **More info**, then **Run anyway**.

      # Fail loudly rather than leaving a release nobody can download. The
      # updater reads this file, so if it is unreachable the app silently stops
      # being able to update itself.
      - name: Check the public download actually works
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          url="https://github.com/wallraven-app/wallraven/releases/download/${{ github.ref_name }}/Wallraven-Setup-v${{ steps.version.outputs.version }}.exe"
          echo "checking $url with no credentials"
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -L -o /dev/null -w '%{http_code}' --max-time 300 "$url" || true)
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::the published installer is not reachable without a token; the updater will not work"
          exit 1
