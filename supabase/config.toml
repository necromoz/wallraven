# Branded replacements for Supabase's generic "via Supabase Auth" templates.
# This is the documented syntax for `supabase start` locally and for
# `supabase config push` against a linked project (see
# https://supabase.com/docs/guides/cli/customizing-email-templates), but it
# is NOT confirmed to actually push template content to a *hosted* project --
# Supabase's own hosted-projects guidance says to paste these into
# Authentication > Email Templates in the dashboard instead, and nothing
# here has been run against the real project yet. Treat supabase/templates/
# as the source of truth either way: paste from there, don't retype.
#
# Reauthentication has no config.toml key (not in Supabase's supported
# list) -- supabase/templates/reauthentication.html is dashboard-paste only.
[auth.email.template.confirmation]
subject = "Confirm your WallRaven signup"
content_path = "./supabase/templates/confirm-signup.html"

[auth.email.template.recovery]
subject = "Reset your WallRaven password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your WallRaven sign-in link"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.invite]
subject = "You've been invited to WallRaven"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "Confirm your new WallRaven email"
content_path = "./supabase/templates/email-change.html"